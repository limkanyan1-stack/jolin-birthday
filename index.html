<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080510">
<title>Jolin · Birthday.exe</title>
<style>
  :root{
    --bg:#080510; --purple:#b76cff; --pink:#ff83dc; --cyan:#79f7ff;
    --glow:rgba(183,108,255,.55); --cream:#f7dfff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:#f8edff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
  body{overflow-x:hidden}
  #matrix{position:fixed;inset:0;width:100%;height:100%;z-index:0;opacity:.47}
  .scanlines{position:fixed;inset:0;z-index:1;pointer-events:none;background:repeating-linear-gradient(to bottom,transparent 0 3px,rgba(255,255,255,.025) 4px)}
  .wrap{position:relative;z-index:2;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:34px 18px}
  .panel{width:min(760px,100%);text-align:center;border:1px solid rgba(183,108,255,.35);border-radius:26px;padding:clamp(22px,5vw,46px);background:linear-gradient(145deg,rgba(20,10,35,.88),rgba(8,5,16,.83));box-shadow:0 0 55px rgba(132,58,220,.16),inset 0 0 35px rgba(183,108,255,.06);backdrop-filter:blur(8px)}
  .eyebrow{font:600 11px/1.6 ui-monospace,monospace;letter-spacing:.24em;color:var(--cyan);text-transform:uppercase}
  h1{font-size:clamp(34px,8vw,68px);line-height:1.02;margin:13px 0 8px;letter-spacing:.045em;color:#fff;text-shadow:0 0 10px var(--purple),0 0 28px var(--glow)}
  .subtitle{font:13px ui-monospace,monospace;letter-spacing:.13em;color:#d8b7ff}
  .cake-stage{height:340px;position:relative;display:flex;align-items:center;justify-content:center;margin:12px auto 0;perspective:900px}
  .cake-glow{position:absolute;width:280px;height:110px;bottom:38px;border-radius:50%;background:rgba(161,77,255,.22);filter:blur(35px)}
  .cake{position:relative;width:260px;height:230px;transform-style:preserve-3d;animation:float 4s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(5px) rotateX(3deg)}50%{transform:translateY(-8px) rotateX(3deg)}}
  .plate{position:absolute;left:5px;bottom:8px;width:250px;height:36px;border-radius:50%;background:linear-gradient(#d9c9ef,#75608e 55%,#30203e);box-shadow:0 8px 20px #000,0 0 22px var(--glow)}
  .tier{position:absolute;left:30px;width:200px;height:100px;bottom:34px;border-radius:18px 18px 26px 26px;background:linear-gradient(90deg,#43205f 0%,#a65cce 22%,#e2a5fa 48%,#8742b8 76%,#35184f 100%);box-shadow:inset 0 -13px 0 rgba(35,8,53,.38),inset 0 5px 10px rgba(255,255,255,.35),0 13px 20px rgba(0,0,0,.45)}
  .tier:before{content:"";position:absolute;left:0;right:0;top:-15px;height:31px;border-radius:50%;background:linear-gradient(90deg,#b66be0,#f4caff 48%,#a14ed1);box-shadow:0 4px 10px rgba(0,0,0,.25)}
  .icing-drip{position:absolute;top:0;left:20px;width:13px;height:35px;background:#efc6ff;border-radius:0 0 9px 9px;box-shadow:36px 0 #e8b9ff,82px 0 #f3d6ff,129px 0 #e6b0ff}
  .name{position:absolute;z-index:2;left:0;right:0;top:45px;font-family:Georgia,serif;font-style:italic;font-size:27px;color:#fff;text-shadow:0 0 8px #fff,0 0 15px #d88aff}
  .date{position:absolute;z-index:2;left:0;right:0;top:77px;font:9px ui-monospace,monospace;letter-spacing:.22em;color:#fff0ff}
  .candle{position:absolute;z-index:4;bottom:129px;left:calc(50% - 7px);width:14px;height:56px;border-radius:5px 5px 2px 2px;background:repeating-linear-gradient(135deg,#fff 0 7px,#d6a5ff 7px 14px);box-shadow:0 0 12px rgba(255,255,255,.25)}
  .wick{position:absolute;top:-7px;left:6px;width:2px;height:9px;background:#34213b}
  .flame{position:absolute;top:-29px;left:1px;width:12px;height:23px;border-radius:60% 40% 55% 45%;background:radial-gradient(ellipse at 50% 70%,#fff 0 18%,#bafaff 25%,#a75dff 68%,transparent 72%);filter:drop-shadow(0 0 8px #d7a0ff);transform-origin:50% 90%;animation:flicker .16s infinite alternate}
  @keyframes flicker{from{transform:rotate(-5deg) scale(.95)}to{transform:rotate(5deg) scale(1.08)}}
  .spark{position:absolute;width:6px;height:6px;background:#fff;border-radius:50%;box-shadow:0 0 12px 3px var(--purple);animation:twinkle 2s infinite ease-in-out}
  .spark:nth-child(1){top:50px;left:14%}.spark:nth-child(2){top:100px;right:12%;animation-delay:.7s}.spark:nth-child(3){bottom:55px;left:20%;animation-delay:1.1s}.spark:nth-child(4){bottom:80px;right:19%;animation-delay:.4s}
  @keyframes twinkle{0%,100%{opacity:.2;transform:scale(.6)}50%{opacity:1;transform:scale(1.5)}}
  .message{font-size:clamp(19px,4vw,25px);font-weight:700;color:#f7dfff;text-shadow:0 0 15px rgba(205,137,255,.55);margin:0 0 9px}
  .date-line{font:12px ui-monospace,monospace;color:#c7a9e9;letter-spacing:.2em}
  .actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:25px}
  button{border:1px solid rgba(212,160,255,.7);border-radius:999px;padding:13px 20px;background:linear-gradient(110deg,#6b2b9e,#a64bd2);color:white;font-weight:700;letter-spacing:.04em;cursor:pointer;box-shadow:0 0 18px rgba(168,91,255,.24);transition:transform .2s,box-shadow .2s}
  button:hover{transform:translateY(-2px);box-shadow:0 0 25px rgba(198,120,255,.55)}
  button.secondary{background:rgba(255,255,255,.04);color:#e8d4ff}
  button:focus-visible{outline:2px solid white;outline-offset:4px}
  .status{min-height:22px;margin-top:18px;color:#a9faff;font:11px ui-monospace,monospace;letter-spacing:.08em}
  .footer{margin-top:22px;color:#806b98;font:10px ui-monospace,monospace;letter-spacing:.12em}
  .confetti{position:fixed;z-index:5;top:-20px;width:8px;height:13px;pointer-events:none;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.1}}
  .hidden{display:none!important}
  @media(max-width:480px){.cake-stage{height:300px;transform:scale(.9);margin:-2px auto}.panel{padding:25px 16px}.cake{transform:scale(.9)}}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<canvas id="matrix" aria-hidden="true"></canvas><div class="scanlines"></div>
<main class="wrap">
  <section class="panel">
    <div class="eyebrow">✦ encrypted birthday transmission · 2026 ✦</div>
    <h1>HAPPY BIRTHDAY</h1>
    <div class="subtitle">A SPECIAL MESSAGE FOR JOLIN</div>
    <div class="cake-stage" aria-label="紫色霓虹生日蛋糕">
      <span class="spark"></span><span class="spark"></span><span class="spark"></span><span class="spark"></span>
      <div class="cake-glow"></div>
      <div class="cake" id="cake">
        <div class="plate"></div>
        <div class="tier"><div class="icing-drip"></div><div class="name">Jolin</div><div class="date">20 NOVEMBER 2026</div></div>
        <div class="candle" id="candle"><span class="wick"></span><span class="flame" id="flame"></span></div>
      </div>
    </div>
    <p class="message">生日快乐，Jolin！</p>
    <div class="date-line">20 · 11 · 2026</div>
    <div class="actions">
      <button id="lightBtn" type="button">✦ 点亮蜡烛</button>
      <button id="blowBtn" type="button">吹灭蜡烛 ✧</button>
      <button id="surpriseBtn" class="secondary" type="button">开启生日惊喜</button>
    </div>
    <div class="status" id="status" aria-live="polite">SYSTEM READY // MAKE A WISH, JOLIN</div>
    <div class="footer">ACCESS GRANTED · ONLY GOOD VIBES ALLOWED</div>
  </section>
</main>
<script>
(() => {
  // Matrix-style digital rain background
  const canvas = document.getElementById('matrix');
  const ctx = canvas.getContext('2d');
  const chars = 'アカサタナハマヤラワ012345789ABCDEFアイウエオ';
  let cols = 0, drops = [], fontSize = 15, width = 0, height = 0;
  function resize(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    width = window.innerWidth; height = window.innerHeight;
    canvas.width = width*dpr; canvas.height = height*dpr;
    canvas.style.width = width+'px'; canvas.style.height = height+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    cols = Math.ceil(width/fontSize);
    drops = Array.from({length:cols},()=>Math.random()*-height/fontSize);
  }
  function rain(){
    ctx.fillStyle = 'rgba(8,5,16,0.10)';
    ctx.fillRect(0,0,width,height);
    ctx.font = fontSize+'px monospace';
    for(let i=0;i<drops.length;i++){
      const ch = chars[Math.floor(Math.random()*chars.length)];
      ctx.fillStyle = Math.random()>.985 ? '#ffffff' : (Math.random()>.35 ? '#bd77ff' : '#7140a6');
      ctx.fillText(ch,i*fontSize,drops[i]*fontSize);
      if(drops[i]*fontSize>height && Math.random()>.975) drops[i]=0;
      drops[i]+=.55+Math.random()*.55;
    }
    requestAnimationFrame(rain);
  }
  window.addEventListener('resize',resize,{passive:true}); resize(); rain();

  const flame = document.getElementById('flame');
  const status = document.getElementById('status');
  const lightBtn = document.getElementById('lightBtn');
  const blowBtn = document.getElementById('blowBtn');
  function light(){
    flame.classList.remove('hidden');
    status.textContent = 'CANDLE ONLINE // MAKE YOUR WISH ✨';
  }
  function blow(){
    flame.classList.add('hidden');
    status.textContent = 'WISH SENT INTO THE UNIVERSE // HAPPY BIRTHDAY, JOLIN 💜';
    confetti();
  }
  function confetti(){
    const colors=['#c084fc','#f0abfc','#67e8f9','#ffffff','#a78bfa'];
    for(let i=0;i<75;i++){
      const bit=document.createElement('i'); bit.className='confetti';
      bit.style.left=Math.random()*100+'vw';
      bit.style.background=colors[Math.floor(Math.random()*colors.length)];
      bit.style.animationDuration=(2.5+Math.random()*3)+'s';
      bit.style.animationDelay=(Math.random()*.7)+'s';
      document.body.appendChild(bit);
      setTimeout(()=>bit.remove(),6500);
    }
  }
  lightBtn.addEventListener('click',light);
  blowBtn.addEventListener('click',blow);
  document.getElementById('surpriseBtn').addEventListener('click',()=>{
    status.textContent='SURPRISE UNLOCKED // YOU DESERVE ALL THE HAPPINESS 💜';
    confetti();
  });
  document.getElementById('cake').addEventListener('click',()=>{
    status.textContent='CAKE DETECTED // ONE BIG BIRTHDAY HUG FOR JOLIN';
  });
})();
</script>
</body>
</html>
